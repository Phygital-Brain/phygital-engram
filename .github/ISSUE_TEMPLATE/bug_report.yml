name: Something doesn't work
description: Report a bug or an error message.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this. Before you start, have a look at [Troubleshooting](https://github.com/Phygital-Brain/phygital-engram/blob/main/docs/troubleshooting.md): many problems have a quick fix there.

        **Security problem?** Don't post it here. Use [private reporting](https://github.com/Phygital-Brain/phygital-engram/security/advisories/new) instead.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      description: This page is public. Anyone can read it.
      options:
        - label: I removed passwords, keys, tokens and private data from everything below.
          required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Error message
      description: Copy the exact message, if there was one. Output from your terminal helps too.
      render: text
  - type: dropdown
    id: how
    attributes:
      label: How do you run it?
      options:
        - On my computer, from the command line
        - On my computer, with the search page
        - Something else
    validations:
      required: true
  - type: dropdown
    id: app
    attributes:
      label: Which AI app, if any?
      multiple: true
      options:
        - Claude (website or phone)
        - Claude Desktop
        - Claude Code
        - Codex
        - ChatGPT
        - Cursor
        - VS Code
        - Gemini CLI
        - Something else
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 15, Windows 11, Ubuntu 24.04 ...
  - type: input
    id: version
    attributes:
      label: Version
      description: The version number, or the date you installed or last updated.
      placeholder: 0.2.1
